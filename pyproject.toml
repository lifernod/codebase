[project]
name = "codebase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.9",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.58.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
